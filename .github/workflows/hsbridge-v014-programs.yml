name: HSBridge V014 Programs Fast Refresh

on:
  push:
    branches:
      - main
    paths:
      - 'bridge/windows/**'
      - 'bridge/hsklient-server/**'
      - '.github/workflows/hsbridge-v014-programs.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bridge/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Test HSBridge
        shell: cmd
        run: go test ./...
      - name: Verify V014 source
        shell: powershell
        run: |
          $programs = Get-Content .\programs.go -Raw
          $actions = Get-Content .\program_actions.go -Raw
          if ($programs -notmatch 'programsPollInterval\s*=\s*10\s*\*\s*time\.Minute') { throw "10-minute Programs sync missing" }
          if ($actions -notmatch 'affected customer only') { throw "Immediate customer-only mirror missing" }
      - name: Build HSBridge
        shell: cmd
        run: |
          set GOOS=windows
          set GOARCH=amd64
          set CGO_ENABLED=0
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o HSBridge.exe .
      - name: Patch version resource
        shell: cmd
        run: python patch_version.py HSBridge.exe
      - name: Verify build metadata
        shell: powershell
        run: |
          $v = (Get-Item .\HSBridge.exe).VersionInfo
          if ($v.ProductVersion -notmatch 'V014') { throw "Wrong product version" }
      - name: Package
        shell: powershell
        run: |
          Compress-Archive -Path HSBridge.exe, README.md -DestinationPath HSBridge_V014_PROGRAMS_FAST_REFRESH.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: HSBridge_V014_PROGRAMS_FAST_REFRESH
          path: bridge/windows/HSBridge_V014_PROGRAMS_FAST_REFRESH.zip
          if-no-files-found: error
