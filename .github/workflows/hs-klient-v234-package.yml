name: HS Klient V234 package

on:
  push:
    branches:
      - hs-klient-v234-programs-kpi-i18n
      - main
    paths:
      - 'hs-client-ui/**'
      - 'README.md'
      - 'README_V234.md'
      - '.github/workflows/hs-klient-v234-package.yml'
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          php -l hs-client-ui/php/index.php
          php -l hs-client-ui/php/strana/KartaOsoby.php
          php -l hs-client-ui/php/strana/_programs_data.php
          php -l hs-client-ui/php/strana/ssf/ssf_zakaznici.php

      - name: JavaScript syntax
        run: |
          node --check hs-client-ui/js/client-customers.js
          node --check hs-client-ui/js/client-detail-programs.js
          node --check hs-client-ui/js/i18n.js

      - name: Verify V234 invariants
        shell: bash
        run: |
          grep -Fq 'PROGRAM_NAME_MAX = 24' hs-client-ui/js/client-customers.js
          grep -Fq 'hs-program-column-select' hs-client-ui/js/client-customers.js
          grep -Fq 'totalRemaining' hs-client-ui/php/strana/_programs_data.php
          grep -Fq '"ZÓNY TĚLA": "Zóny těla"' hs-client-ui/js/i18n.js
          grep -Fq 'data-hs-i18n-force' hs-client-ui/php/strana/KartaOsoby.php
          test "$(tr -d '\r\n ' < hs-client-ui/VERSION.txt)" = "234"

      - name: Package
        run: |
          zip -qr KLIENT_HAIRSOFT_V234_PROGRAMY_KPI_I18N.zip .             -x '.git/*' '.github/*' 'KLIENT_HAIRSOFT_V234_PROGRAMY_KPI_I18N.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: KLIENT_HAIRSOFT_V234_PROGRAMY_KPI_I18N
          path: KLIENT_HAIRSOFT_V234_PROGRAMY_KPI_I18N.zip
          if-no-files-found: error
