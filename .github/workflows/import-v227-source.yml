name: Import HS Klient V227 source

on:
  push:
    branches:
      - v227-with-hsbridge-v006
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand V227 source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="staging/KLIENT_HAIRSOFT_V227_PROGRAMY_DOCHAZKA.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Archive already imported."
            exit 0
          fi
          unzip -o "$ARCHIVE" -d .
          rm -rf staging
          git config user.name "UnisSoft"
          git config user.email "info@unissoft.cz"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Import HS Klient V227 source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
